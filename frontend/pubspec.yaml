name: frontend
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.1.0
  provider: ^6.1.1
  http: ^1.2.0
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.4
  fl_chart: ^1.2.0 # 👈 kept latest, removed duplicate ^0.66.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
