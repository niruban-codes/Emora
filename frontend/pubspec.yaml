name: frontend
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.1.0
  provider: ^6.1.1
  http: ^1.2.0
  image_picker: ^1.2.2
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.4
  fl_chart: ^1.2.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  google_sign_in: 6.2.1
  cloud_firestore: ^6.2.0
  lottie: ^3.3.2
  youtube_player_flutter: ^9.1.3
  flutter_inappwebview: ^5.8.0
  dio: ^5.9.2
  firebase_storage: ^13.4.2
  cached_network_image: ^3.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
